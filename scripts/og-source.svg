<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#C13EFF"/>
      <stop offset="55%" stop-color="#7B4EFF"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(157,78,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,184,212,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0F"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Corner brackets (cyan) — brutalist signature -->
  <g stroke="#00E5FF" stroke-width="3" fill="none">
    <path d="M 32 32 L 64 32 M 32 32 L 32 64"/>
    <path d="M 1168 32 L 1136 32 M 1168 32 L 1168 64"/>
    <path d="M 32 598 L 64 598 M 32 598 L 32 566"/>
    <path d="M 1168 598 L 1136 598 M 1168 598 L 1168 566"/>
  </g>

  <!-- Top kicker pill -->
  <rect x="80" y="80" width="500" height="42" fill="rgba(0,229,255,0.08)" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="100" cy="101" r="5" fill="#00E5FF"/>
  <text x="118" y="108" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif"
        font-size="14" font-weight="700" fill="#00E5FF" letter-spacing="3">FACIAL RECOGNITION · LIVE ENTERTAINMENT</text>

  <!-- Big headline (3 lines, T2 gradient) -->
  <text x="80" y="240" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif"
        font-size="80" font-weight="900" fill="#fff" letter-spacing="-3" textLength="380">YOU WERE</text>
  <text x="80" y="340" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif"
        font-size="120" font-weight="900" fill="url(#brand)" letter-spacing="-5">THERE.</text>
  <text x="80" y="425" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif"
        font-size="56" font-weight="900" fill="#fff" letter-spacing="-2">WE HAVE THE PROOF.</text>

  <!-- Tagline -->
  <text x="80" y="495" font-family="'Helvetica Neue', sans-serif"
        font-size="20" fill="rgba(255,255,255,0.7)">Find yourself in thousands of photos from concerts, conventions and the moments that mattered.</text>

  <!-- Bottom-left: skull-eye logomark (mini) -->
  <g transform="translate(80, 540)">
    <rect width="56" height="56" rx="12" fill="#0A0A0F" stroke="url(#brand)" stroke-width="2"/>
    <circle cx="19" cy="29" r="9" fill="none" stroke="url(#brand)" stroke-width="3"/>
    <circle cx="19" cy="27" r="3.5" fill="url(#brand)"/>
    <circle cx="37" cy="29" r="9" fill="none" stroke="url(#brand)" stroke-width="3"/>
    <circle cx="37" cy="27" r="3.5" fill="url(#brand)"/>
  </g>

  <!-- Bottom-left: wordmark text -->
  <text x="152" y="570" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif"
        font-size="34" font-weight="700" fill="#fff" letter-spacing="-1.5">fanSnap</text>
  <text x="152" y="595" font-family="'JetBrains Mono', 'Menlo', monospace"
        font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">powered by O&amp;CO  ·  betofabri.com/fansnap</text>
</svg>
